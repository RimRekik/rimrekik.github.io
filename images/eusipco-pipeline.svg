<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <pattern id="noise" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#9aa4ad"/><rect x="0" y="0" width="2" height="2" fill="#5f6a74"/><rect x="3" y="3" width="2" height="2" fill="#c8d0d6"/><rect x="4" y="0" width="1" height="2" fill="#424b53"/>
    </pattern>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b4c7e"/><stop offset="0.45" stop-color="#58a4b0"/><stop offset="1" stop-color="#f2c14e"/></linearGradient>
    <linearGradient id="clean" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b7780"/><stop offset="1" stop-color="#cfd6db"/></linearGradient>
  </defs>

  <!-- noisy image -->
  <rect x="20" y="95" width="110" height="110" rx="4" fill="url(#noise)" stroke="#333"/>
  <text x="75" y="228" font-size="13" text-anchor="middle" fill="#222">Noisy image</text>
  <text x="75" y="245" font-size="11.5" text-anchor="middle" fill="#666">(noise type unknown)</text>

  <!-- classifier -->
  <rect x="170" y="40" width="160" height="70" rx="8" fill="#e6eef5" stroke="#2a4d69"/>
  <text x="250" y="68" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d1d1d">Noise classifier</text>
  <text x="250" y="88" font-size="12" text-anchor="middle" fill="#333">Gaussian or Poisson?</text>

  <!-- parameter net -->
  <rect x="170" y="170" width="160" height="80" rx="8" fill="#e6eef5" stroke="#2a4d69"/>
  <text x="250" y="198" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d1d1d">Parameter network</text>
  <text x="250" y="217" font-size="12" text-anchor="middle" fill="#333">patch-based, sliding</text>
  <text x="250" y="233" font-size="12" text-anchor="middle" fill="#333">window (trained on SSIM)</text>

  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M132,130 C150,120 150,80 166,76"/>
    <path d="M132,170 C150,180 150,205 166,208"/>
    <line x1="250" y1="112" x2="250" y2="166"/>
    <line x1="332" y1="210" x2="386" y2="210"/>
  </g>
  <text x="258" y="144" font-size="11" fill="#666">selects model</text>

  <!-- parameter map -->
  <rect x="390" y="155" width="110" height="110" rx="4" fill="url(#map)" stroke="#333"/>
  <text x="445" y="283" font-size="13" text-anchor="middle" fill="#222">Pixel-wise TV map λ(x)</text>

  <!-- variational solver -->
  <rect x="545" y="95" width="180" height="90" rx="8" fill="#fbeee6" stroke="#8a3b12"/>
  <text x="635" y="125" font-size="13" text-anchor="middle" font-weight="bold" fill="#1d1d1d">Weighted TV denoising</text>
  <text x="635" y="146" font-size="12" text-anchor="middle" fill="#333">data fidelity (Gaussian / Poisson)</text>
  <text x="635" y="164" font-size="12" text-anchor="middle" fill="#333">+ λ(x) · TV regularization</text>

  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M502,200 C525,195 525,170 541,165"/>
    <path d="M332,72 C440,60 560,60 600,91"/>
    <path d="M75,93 C75,-10 520,-15 585,91"/>
    <line x1="727" y1="140" x2="761" y2="140"/>
  </g>

  <!-- output -->
  <rect x="765" y="85" width="110" height="110" rx="4" fill="url(#clean)" stroke="#333"/>
  <text x="820" y="218" font-size="13" text-anchor="middle" fill="#222">Denoised image</text>
</svg>
